<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Elige tu contraseña — like hoodie ♡</title>
<link rel="stylesheet" href="admin.css?v=20261123-clave1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="login" role="main" aria-label="Elegir contraseña">
    <div class="login-card">
      <a class="admin-brand" href="index.html">
        <span class="admin-mark">♥</span>
        <span>like hoodie ♡</span>
      </a>
      <p class="eyebrow">Acceso al panel</p>
      <h1 id="clave-title">Elige tu contraseña.</h1>
      <p class="login-sub" id="clave-sub">La usarás junto a tu correo para entrar.</p>

      <form id="clave-form" autocomplete="off" hidden>
        <label for="clave-password">Contraseña nueva</label>
        <input id="clave-password" name="password" type="password" minlength="10" required autocomplete="new-password" placeholder="Mínimo 10 caracteres">
        <label for="clave-confirm">Repite la contraseña</label>
        <input id="clave-confirm" name="confirm" type="password" minlength="10" required autocomplete="new-password" placeholder="Otra vez">
        <button class="btn" type="submit" id="clave-button">Guardar contraseña</button>
        <p class="form-error" id="clave-error" role="alert" hidden></p>
      </form>

      <div id="clave-message" hidden></div>

      <a class="back-link" href="index.html">← Volver a la tienda</a>
    </div>
  </div>

  <script src="vendor/supabase-js.min.js?v=20261110-sec1"></script>
  <script src="supabase-config.js?v=20261110-pub1"></script>
  <script src="clave.js?v=20261123-clave2"></script>
</body>
</html>
