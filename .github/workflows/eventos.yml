name: Eventos

on:
  schedule:
    # Lunes a las 14:00 UTC (08:00 CDMX)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Actualizar cartelera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar clave de Ticketmaster
        id: check
        run: |
          if [ -z "${{ secrets.TICKETMASTER_API_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar eventos
        if: steps.check.outputs.configured == 'true'
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/sync-ticketmaster.mjs

      - name: Guardar cambios
        if: steps.check.outputs.configured == 'true'
        run: |
          if git diff --quiet eventos.json; then
            echo "Sin cambios en la cartelera."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          git commit -m "Datos: actualizar cartelera de eventos"
          git push

      - name: Avisar si falta la clave
        if: steps.check.outputs.configured != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search 'Configurar TICKETMASTER_API_KEY in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "La incidencia ya existe: #$existing"
            exit 0
          fi
          body=$(cat <<'EOF'
La cartelera de eventos no puede actualizarse porque falta el secreto `TICKETMASTER_API_KEY`.

Pasos:

1. Crea una API key gratuita en https://developer.ticketmaster.com/
2. Guarda la clave en el repositorio:

   gh secret set TICKETMASTER_API_KEY --repo celc91/like-hoodie

3. Ejecuta Actions → Eventos → Run workflow.

La clave se usa solo en CI y nunca se publica en el sitio.
EOF
          )
          gh issue create --title "Configurar TICKETMASTER_API_KEY" --body "$body"
