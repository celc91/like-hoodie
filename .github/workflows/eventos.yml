name: Eventos

on:
  push:
    branches: [main]
    paths:
      - eventos.csv
  schedule:
    # Lunes a las 14:00 UTC (08:00 CDMX)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Actualizar cartelera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar desde CSV
        env:
          EVENTS_CSV_URL: ${{ vars.EVENTS_CSV_URL }}
        run: node scripts/sync-events-csv.mjs

      - name: Comprobar cambios
        run: |
          if git diff --quiet eventos.json; then
            echo "Sin cambios en eventos.json."
            exit 0
          fi
          echo "Hay cambios pendientes de publicar en eventos.json:"
          git --no-pager diff --stat eventos.json

      # main está protegida y el token de Actions no puede saltarse los checks.
      # En vez de fallar, se abre una incidencia con los pasos para publicar.
      - name: Avisar si la cartelera necesita publicarse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          age=$(node -e "const d=require('./eventos.json'); console.log(Math.floor((Date.now()-new Date(d.updated).getTime())/86400000))")
          changed=$(git diff --quiet eventos.json && echo no || echo si)
          title="Cartelera de eventos pendiente de publicar"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ "$changed" = "no" ] && [ "$age" -le 45 ]; then
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh issue close "$existing" --comment "La cartelera está publicada y al día."
            fi
            exit 0
          fi

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "La incidencia ya existe: #$existing"
            exit 0
          fi

          body=$(printf 'La cartelera tiene cambios sin publicar o lleva %s días sin actualizarse.\n\nPara publicarla:\n\n```\nnode scripts/sync-events-csv.mjs\ngit add eventos.json\ngit commit -m "Datos: actualizar cartelera de eventos"\ngit push\n```\n\nDespués cierra esta incidencia.' "$age")
          gh issue create --title "$title" --body "$body"
