name: Eventos

on:
  push:
    branches: [main]
    paths:
      - eventos.csv
  schedule:
    # Lunes a las 14:00 UTC (08:00 CDMX)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Actualizar cartelera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar desde CSV
        env:
          EVENTS_CSV_URL: ${{ vars.EVENTS_CSV_URL }}
        run: node scripts/sync-events-csv.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet eventos.json; then
            echo "Sin cambios en eventos.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          git commit -m "Datos: actualizar cartelera de eventos"
          git push

      - name: Avisar si la cartelera está vieja
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          age=$(node -e "const d=require('./eventos.json'); console.log(Math.floor((Date.now()-new Date(d.updated).getTime())/86400000))")
          existing=$(gh issue list --state open --search 'Actualizar cartelera de eventos in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$age" -le 45 ]; then
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh issue close "$existing" --comment "Cartelera actualizada."
            fi
            exit 0
          fi
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "La incidencia de cartelera ya existe: #$existing"
            exit 0
          fi
          body=$(printf 'La cartelera no se actualiza desde hace %s días.\n\nEdita eventos.csv o publica una hoja de cálculo como CSV y configura la variable EVENTS_CSV_URL. Después ejecuta Actions -> Eventos -> Run workflow.' "$age")
          gh issue create --title "Actualizar cartelera de eventos" --body "$body"
