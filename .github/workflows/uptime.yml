name: Disponibilidad

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Comprobar likehoodie.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar páginas y backend
        id: check
        run: |
          fail=0
          report=""
          check() {
            name="$1"
            url="$2"
            expected="$3"
            ok=0
            code="000"
            for attempt in 1 2 3 4; do
              code=$(curl -L -sS --retry 2 --retry-delay 4 -o /tmp/page.html -w "%{http_code}" --max-time 25 "$url" || echo "000")
              if [ "$code" = "200" ] && { [ -z "$expected" ] || grep -q "$expected" /tmp/page.html; }; then
                ok=1
                break
              fi
              sleep 8
            done
            if [ "$ok" != "1" ]; then
              fail=1
              if [ "$code" != "200" ]; then
                report="${report}- ${name}: HTTP ${code}\n"
              else
                report="${report}- ${name}: no contiene '${expected}'\n"
              fi
            fi
          }

          check "Home" "https://likehoodie.com/" "like hoodie"
          check "CSS" "https://likehoodie.com/styles.css" ""
          check "Producto" "https://likehoodie.com/modelos/cocodrilo.html" "Cocodrilo de Miami"
          check "Seguimiento" "https://likehoodie.com/pedido.html" "data-track-form"
          check "Factura" "https://likehoodie.com/factura.html" "data-invoice-form"
          check "Admin" "https://likehoodie.com/admin.html" "Administración"

          key=$(grep -o 'sb_publishable_[A-Za-z0-9_]*' supabase-config.js | head -1)
          rpc_code=$(curl -sS --retry 2 --retry-delay 4 -o /tmp/rpc.json -w "%{http_code}" --max-time 20 \
            -X POST "https://qrblsclpzoaxfaggsrda.supabase.co/functions/v1/order-status" \
            -H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H "Content-Type: application/json" \
            -d '{"number":1,"email":"nadie@example.com"}' || echo "000")
          if [ "$rpc_code" != "200" ] || ! grep -q '"found":false' /tmp/rpc.json; then
            fail=1
            report="${report}- Edge Function order-status: HTTP ${rpc_code}\n"
          fi

          invoice_code=$(curl -sS --retry 2 --retry-delay 4 -o /dev/null -w "%{http_code}" --max-time 20 \
            -X OPTIONS "https://qrblsclpzoaxfaggsrda.supabase.co/functions/v1/invoice-request" \
            -H "Origin: https://likehoodie.com" -H "Access-Control-Request-Method: POST" || echo "000")
          if [ "$invoice_code" != "200" ]; then
            fail=1
            report="${report}- Edge Function invoice-request: HTTP ${invoice_code}\n"
          fi

          auth_code=$(curl -sS --retry 2 --retry-delay 4 -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://qrblsclpzoaxfaggsrda.supabase.co/auth/v1/health" \
            -H "apikey: ${key}" || echo "000")
          if [ "$auth_code" != "200" ]; then
            fail=1
            report="${report}- Supabase Auth: HTTP ${auth_code}\n"
          fi

          expiry=$(echo | openssl s_client -servername likehoodie.com -connect likehoodie.com:443 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          tls_days=-1
          if [ -n "$expiry" ]; then
            end=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
            if [ "$end" != "0" ]; then
              tls_days=$(( (end - $(date +%s)) / 86400 ))
            fi
          fi
          if [ "$tls_days" -lt 14 ]; then
            fail=1
            report="${report}- Certificado TLS: caduca en ${tls_days} días\n"
          fi

          ds=$(curl -fsS --max-time 15 "https://dns.google/resolve?name=likehoodie.com&type=DS" || true)
          if ! printf '%s' "$ds" | grep -q '"Answer"'; then
            echo "::warning title=DNSSEC::likehoodie.com no tiene registro DS. DNSSEC sigue pendiente."
          fi

          if [ "$fail" = "1" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            printf "%b" "$report" > /tmp/report.txt
            cat /tmp/report.txt
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir o actualizar incidencia
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(printf 'La comprobación automática falló a las %s.\n\n%s' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$(cat /tmp/report.txt)")
          existing=$(gh issue list --state open --search 'likehoodie.com no responde in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "🚨 likehoodie.com no responde" --body "$body"
          fi

      - name: Cerrar incidencia si se recuperó
        if: steps.check.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search 'likehoodie.com no responde in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Servicio recuperado a las $(date -u '+%Y-%m-%d %H:%M UTC'). La comprobación automática vuelve a pasar."
            gh issue close "$existing"
          fi
