name: HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis JavaScript
        run: |
          for file in *.js vendor/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: html-validate
        run: npx --yes html-validate@8 './*.html' './modelos/*.html'
      - name: Smoke test
        run: node scripts/smoke.mjs
