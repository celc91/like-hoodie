name: RLS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: RLS y concurrencia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Bootstrap de la base local
        run: node scripts/bootstrap-local.mjs

      - name: Concurrencia (PED-13 y NEW-12)
        run: node scripts/test-concurrency.mjs

      - name: pgTAP
        run: supabase test db

      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup
