name: RLS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: RLS y concurrencia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Bootstrap de la base local
        run: node scripts/bootstrap-local.mjs

      - name: Concurrencia (PED-13 y NEW-12)
        run: node scripts/test-concurrency.mjs

      - name: Idempotencia de Clip (SET-08)
        run: node scripts/test-clip-idempotency.mjs

      - name: pgTAP
        run: |
          set +e
          supabase test db 2>&1 | tee pgtap.log
          code=${PIPESTATUS[0]}
          grep -E '^(not ok|# Failed test|Parse errors)' pgtap.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 25 pgtap.log | while IFS= read -r line; do
            echo "::notice::TAIL $line"
          done
          exit $code

      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup
