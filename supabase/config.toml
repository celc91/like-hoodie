# like hoodie ♡ — configuración de Supabase CLI
# La verificación JWT se hace dentro de cada función para controlar CORS
# y para que el webhook público de Clip pueda validar su propio secreto.

project_id = "like-hoodie"

[functions.clip-checkout]
verify_jwt = false

[functions.clip-webhook]
verify_jwt = false

[functions.process-logo]
verify_jwt = true

[functions.order-status]
verify_jwt = false

[functions.client-error]
verify_jwt = false

[functions.invoice-request]
verify_jwt = false

[functions.cleanup-storage]
verify_jwt = false
