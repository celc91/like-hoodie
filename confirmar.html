<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    .confirm-wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 80% 10%, rgba(220, 240, 126, 0.35), transparent 42%), var(--cream);
    }

    .confirm-card {
      width: min(520px, 100%);
      padding: 40px 32px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .confirm-mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: var(--orange);
    }

    .confirm-mark svg {
      width: 30px;
      height: 30px;
      fill: var(--paper);
    }

    .confirm-card h1 {
      font-size: clamp(1.7rem, 5vw, 2.3rem);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .confirm-card p {
      margin: 14px 0 0;
      color: var(--ink-soft);
      line-height: 1.55;
    }

    .confirm-code {
      display: inline-block;
      margin: 22px 0 6px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--lime);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .confirm-actions {
      margin-top: 26px;
    }

    .confirm-note {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
  <script src="i18n-store.js?v=20261124-i18n2"></script>
