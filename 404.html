<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — like hoodie ♡</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --cream: #f4efe6;
      --paper: #fffdf8;
      --ink: #161618;
      --muted: #6d685f;
      --orange: #ff4d1f;
      --lime: #d8f45c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 80% 10%, rgba(216, 244, 92, 0.3), transparent 35%),
        radial-gradient(circle at 10% 90%, rgba(255, 77, 31, 0.14), transparent 35%),
        var(--cream);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(620px, 100%);
      padding: 48px 40px;
      border: 1px solid rgba(22, 22, 24, 0.12);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 24px 60px rgba(22, 22, 24, 0.1);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
    }
    .brand span {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--ink);
      color: var(--orange);
      font-size: 15px;
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--orange);
    }
    h1 {
      margin: 0 0 14px;
      font-family: "Bricolage Grotesque", "Arial Black", sans-serif;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 26px;
      max-width: 42ch;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--cream);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn--ghost {
      background: transparent;
      color: var(--ink);
    }
    .btn--ghost:hover { background: rgba(22, 22, 24, 0.06); }
    @media (prefers-reduced-motion: reduce) {
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><span aria-hidden="true">♡</span>like hoodie</a>
    <p class="eyebrow">Error 404</p>
    <h1>Esta sudadera no existe.</h1>
    <p>La página que buscas se movió o nunca estuvo aquí. Vuelve al inicio o diseña la tuya desde cero.</p>
    <div class="actions">
      <a class="btn" href="/">Volver al inicio</a>
      <a class="btn btn--ghost" href="/#personalizar">Diseñar la mía</a>
    </div>
  </main>
</body>
</html>
